<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Portfolio — fff-fm-404</title>
<meta name="description" content="Saranyaphong Metkaruchit, Senior Developer / Squad Lead. Backend and frontend systems, workflow automation and cloud. Portfolio, work history and contact. Plain quick view available.">
<meta property="og:title" content="Saranyaphong Metkaruchit — Senior Developer / Squad Lead">
<meta property="og:description" content="Portfolio, work history and contact.">
<meta property="og:type" content="profile">
<link rel="alternate" href="quick.html" title="Quick view">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&family=DotGothic16&family=Noto+Sans+Thai:wght@400;500;600;800&family=Noto+Serif+Thai:wght@400;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:,"><link rel="stylesheet" href="base.css">
<style>
:root{
  --navy:#16213a;--navy2:#22325a;--teal:#2a9d8f;--amber:#ffb703;--coral:#ef6f5e;--paper:#f8f3e9;--paper2:#ece4d3;--ink:#16213a;--ink2:#4a5470;
  --mb:34px;--dock:76px;
  --ui:"IBM Plex Sans Thai",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
}
html,body{height:100%;overflow:hidden;background:var(--navy);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.65}
body{position:fixed;inset:0}
/* wallpaper */
.wall{position:fixed;inset:0;background:
  radial-gradient(1200px 700px at 78% 8%,rgba(42,157,143,.55),transparent 60%),
  radial-gradient(900px 600px at 10% 95%,rgba(239,111,94,.32),transparent 60%),
  linear-gradient(160deg,#1d2b4d,#111a2f 70%)}
.wall::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse at 50% 45%,#000 20%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at 50% 45%,#000 20%,transparent 75%)}
.wall .sun{position:absolute;right:12%;top:14%;width:min(34vw,380px);aspect-ratio:1;border-radius:50%;background:linear-gradient(180deg,var(--amber),var(--coral));opacity:.9;transform:translate(calc(var(--mx,0)*-14px),calc(var(--my,0)*-10px));
  -webkit-mask-image:repeating-linear-gradient(180deg,#000 0 14px,transparent 14px 20px);mask-image:repeating-linear-gradient(180deg,#000 0 14px,transparent 14px 20px);mask-size:100% 70%;-webkit-mask-size:100% 70%;mask-position:0 100%;-webkit-mask-position:0 100%;mask-repeat:no-repeat;-webkit-mask-repeat:no-repeat;filter:saturate(.9)}
/* menubar */
.mb{position:fixed;left:0;right:0;top:0;height:var(--mb);z-index:5000;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 12px;padding-top:env(safe-area-inset-top);box-sizing:content-box;background:rgba(248,243,233,.92);backdrop-filter:blur(10px);color:var(--ink);font-size:15px;font-weight:600;border-bottom:2px solid var(--ink)}
.mb>div{display:flex;align-items:center;gap:14px;min-width:0}
.logo{font-family:var(--mono);font-weight:600;background:var(--ink);color:var(--amber);padding:0 8px;border-radius:5px;line-height:24px;font-size:14px;letter-spacing:.02em}
.mb .app{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.mb button{min-height:28px;padding:0 10px;border-radius:6px;font-weight:600}
.mb button:hover{background:var(--ink);color:var(--paper)}
.mb button:focus-visible{outline:2px solid var(--coral);outline-offset:1px}
.lang .a,.lang .b{opacity:.5}
.lang[aria-pressed="true"] .a,.lang[aria-pressed="false"] .b{opacity:1;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.clock{font-family:var(--mono);font-size:14px;white-space:nowrap}
.clock .dt{margin-right:10px}
/* desktop area */
.desk{position:fixed;left:0;right:0;top:calc(var(--mb) + env(safe-area-inset-top));bottom:0;overflow:hidden}
/* icons */
.ico{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);color:var(--ink);flex:none}
.ico svg{width:30px;height:30px}
.c-about{background:var(--amber)}.c-exp{background:var(--coral)}.c-skills{background:var(--teal);color:#fff}.c-contact{background:var(--paper)}.c-proj{background:#9ad0f5}
.home{position:absolute;right:20px;top:18px;display:flex;flex-direction:column;gap:14px;align-items:flex-end}
.home .app{display:flex;flex-direction:column;align-items:center;gap:4px;width:92px;padding:6px 4px;border-radius:10px;color:#fff;font-weight:600;font-size:14px;line-height:1.3;text-shadow:0 1px 3px rgba(0,0,0,.6);text-align:center}
.home .app:hover{background:rgba(255,255,255,.12)}
.home .app:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.home .app .ico{width:60px;height:60px}
/* dock */
.dock{position:absolute;left:50%;bottom:12px;translate:-50% 0;display:flex;gap:10px;padding:8px 12px;background:rgba(248,243,233,.18);border:2px solid rgba(248,243,233,.55);border-radius:22px;backdrop-filter:blur(14px);z-index:4000}
.dock button{position:relative;display:grid;place-items:center;border-radius:14px;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.dock button:hover,.dock button:focus-visible{transform:translateY(-10px) scale(1.18)}
.dock button:focus-visible{outline:2px solid var(--amber);outline-offset:4px}
.dock button.run::after{content:"";position:absolute;bottom:-8px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--amber)}
.dock .tip{position:absolute;bottom:calc(100% + 14px);left:50%;translate:-50% 0;background:var(--ink);color:#fff;padding:2px 10px;border-radius:6px;font-size:14px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
.dock button:hover .tip,.dock button:focus-visible .tip{opacity:1}
/* windows */
.win{position:absolute;display:flex;flex-direction:column;background:var(--paper);border:2px solid var(--ink);border-radius:14px;box-shadow:7px 7px 0 rgba(10,16,32,.55);overflow:hidden;min-width:300px;min-height:200px;outline:none}
.win.act{box-shadow:9px 9px 0 rgba(10,16,32,.7)}
.win.max{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0}
@media(prefers-reduced-motion:no-preference){.win.pop{animation:wpop .28s cubic-bezier(.2,1.2,.4,1)}@keyframes wpop{from{opacity:0;transform:scale(.92) translateY(14px)}}}
.tb{display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;background:var(--paper2);border-bottom:2px solid var(--ink);cursor:grab;touch-action:none;flex:none;user-select:none;-webkit-user-select:none}
.win.act .tb{background:repeating-linear-gradient(0deg,var(--amber) 0 4px,#ffc93a 4px 8px)}
.tb.drag{cursor:grabbing}
.dots{display:flex;gap:8px}
.d{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);position:relative}
.d.x{background:var(--coral)}.d.m{background:var(--amber)}.d.z{background:var(--teal)}
.win.act .d.m{background:var(--paper)}
.d:hover::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--ink)}
.d:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.ttl{flex:1;text-align:center;font-size:15px;font-weight:700;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--paper);border:2px solid var(--ink);border-radius:6px;padding:5px 10px;max-width:70%;margin:0 auto}
.dots+.ttl{margin-right:44px}
.back{display:none}
.body{flex:1;overflow:auto;padding:22px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.rz{position:absolute;right:0;bottom:0;width:22px;height:22px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 50%,var(--ink) 50% 56%,transparent 56% 70%,var(--ink) 70% 76%,transparent 76%)}
.win.max .rz{display:none}
h3.h{font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--ink2);margin:0 0 10px;font-family:var(--mono)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips li{font-size:15px;font-weight:500;padding:1px 12px;border:2px solid var(--ink);border-radius:999px;background:#fff}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:6px 18px;border:2px solid var(--ink);border-radius:10px;font-weight:600;background:var(--paper);box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s;cursor:pointer;font-size:16px}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.pri{background:var(--amber)}
.btn:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
/* about */
.about{display:grid;grid-template-columns:150px 1fr;gap:22px}
.about img{width:150px;aspect-ratio:3/4;object-fit:cover;object-position:50% 12%;border-radius:10px;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--teal)}
.about h2{font-size:27px;line-height:1.25;font-weight:700}
.about .role{color:var(--coral);font-weight:700;margin:4px 0 12px;filter:brightness(.78)}
.about .sec{margin-top:20px}
/* experience */
.tl{display:grid;gap:16px;position:relative}
.tl li{position:relative;padding:14px 16px;background:#fff;border:2px solid var(--ink);border-radius:10px;box-shadow:3px 3px 0 var(--ink)}
.tl h3{font-size:18px;line-height:1.35;font-weight:700}
.tl .w{font-family:var(--mono);font-size:14px;color:var(--ink2);margin:2px 0 10px;font-weight:500}
.tl .chips li{box-shadow:none;border-width:1.5px;font-size:14px;padding:0 10px}
/* skills */
.sk{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.sk section{padding:14px 16px;background:#fff;border:2px solid var(--ink);border-radius:10px}
/* contact */
.ct{display:grid;gap:14px;max-width:460px}
.ct .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ct .addr{font-family:var(--mono);font-size:17px;font-weight:600;word-break:break-all}
/* finder */
.fnd{display:grid;grid-template-columns:150px 1fr;margin:-22px;min-height:calc(100% + 44px)}
.fnd aside{padding:18px 12px;border-right:2px solid var(--ink);background:var(--paper2);display:flex;flex-direction:column;gap:4px}
.fnd aside button{text-align:left;padding:6px 12px;border-radius:8px;font-weight:600;font-size:15px;min-height:40px}
.fnd aside button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.fnd aside button:hover:not([aria-pressed="true"]){background:rgba(22,33,58,.1)}
.fnd aside button:focus-visible{outline:2px solid var(--coral);outline-offset:1px}
.fnd .main{padding:20px}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:14px}
.file{display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:center;padding:8px;border-radius:10px;border:2px solid transparent}
.file:hover{background:rgba(255,183,3,.2);border-color:var(--ink)}
.file:focus-visible{outline:3px solid var(--coral);outline-offset:1px}
.file .th{aspect-ratio:4/3;border-radius:6px;border:2px solid var(--ink);background:#fff center top/cover no-repeat;position:relative;box-shadow:3px 3px 0 var(--bc,var(--ink))}
.file .th i{position:absolute;right:-2px;bottom:-2px;background:var(--ink);color:#fff;font:600 11px/1 var(--mono);padding:3px 6px;border-radius:5px 0 4px 0;font-style:normal}
.file b{font-size:15px;line-height:1.3;font-weight:700}
.file small{font-size:13.5px;color:var(--ink2);line-height:1.3;display:block}
.stat{margin-top:16px;font-family:var(--mono);font-size:13px;color:var(--ink2)}
/* viewer */
.vwr{display:grid;grid-template-columns:minmax(0,1fr) 250px;margin:-22px;min-height:calc(100% + 44px)}
.vwr .st{background:#1b2540 repeating-conic-gradient(rgba(255,255,255,.04) 0% 25%,transparent 0% 50%) 0 0/24px 24px;display:flex;align-items:center;justify-content:center;padding:14px;border-right:2px solid var(--ink);min-height:240px}
.vwr .st button{display:block;max-width:100%;border-radius:4px;cursor:zoom-in}
.vwr .st img{max-width:100%;max-height:100%;width:auto;height:auto;border-radius:4px;box-shadow:0 8px 30px rgba(0,0,0,.5);object-fit:contain}
.vwr .st button:focus-visible{outline:3px solid var(--amber);outline-offset:4px}
.vwr .side{padding:18px;display:flex;flex-direction:column;gap:12px;background:var(--paper)}
.vwr .side .eb{font-family:var(--mono);font-size:13px;color:var(--ink2);font-weight:500}
.vwr .side h3{font-size:23px;line-height:1.25;font-weight:700}
.vwr .side .ds{font-size:16px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs button{width:72px;aspect-ratio:4/3;border:2px solid var(--ink);border-radius:6px;background:#fff center top/cover;opacity:.7}
.thumbs button[aria-current="true"]{opacity:1;box-shadow:0 0 0 3px var(--amber)}
.thumbs button:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.cap{font-size:15px;font-weight:600}
/* home-screen / mobile */
@media(max-width:759px){
  .dock{display:none}
  .desk{bottom:0}
  .wall .sun{right:-14%;top:auto;bottom:4%;width:78vw}
  .home{position:absolute;inset:0;right:auto;left:0;width:100%;padding:36px 20px;display:grid;grid-template-columns:repeat(3,1fr);gap:22px 10px;align-content:start;justify-items:center;flex-direction:row}
  .home .app{width:100%;max-width:120px;font-size:15px}
  .home .app .ico{width:72px;height:72px;border-radius:20px}
  .home .app .ico svg{width:38px;height:38px}
  .mb .app{max-width:34vw}
  .clock .dt{display:none}
  .win{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:16px 16px 0 0;border-width:2px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.4);min-width:0;margin-top:0}
  .win .rz,.win .dots{display:none}
  .tb{height:56px;cursor:default;background:var(--amber)!important;padding:0 8px}
  .back{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;font-weight:700;border:2px solid var(--ink);border-radius:10px;background:var(--paper);flex:none}
  .back:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
  .ttl{margin:0;flex:1;max-width:none;text-align:left;border:0;background:transparent;font-size:17px}
  .dots+.ttl{margin-right:0}
  .body{padding:18px 16px 40px}
  .about{grid-template-columns:110px 1fr;gap:14px}.about img{width:110px}.about h2{font-size:22px}
  .fnd,.vwr{grid-template-columns:1fr;margin:-18px -16px}
  .fnd aside{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:2px solid var(--ink);padding:10px}
  .fnd aside button{white-space:nowrap}
  .files{grid-template-columns:repeat(2,1fr)}
  .vwr .st{border-right:0;border-bottom:2px solid var(--ink);min-height:0}
  @media(prefers-reduced-motion:no-preference){.win.pop{animation:sheet .32s cubic-bezier(.2,.9,.3,1)}@keyframes sheet{from{transform:translateY(40%);opacity:.4}}}
}
/* dialog */
.dlg{position:fixed;inset:0;z-index:9000;display:grid;place-items:center;padding:14px}
.dlg-back{position:absolute;inset:0;background:rgba(10,16,32,.7);backdrop-filter:blur(3px)}
.dlg-panel{position:relative;width:min(900px,100%);max-height:calc(100dvh - 28px);overflow:auto;background:var(--paper);border:2px solid var(--ink);border-radius:14px;box-shadow:8px 8px 0 rgba(0,0,0,.5)}
.dlg-bar{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:12px;padding:0 12px;height:46px;background:repeating-linear-gradient(0deg,var(--amber) 0 4px,#ffc93a 4px 8px);border-bottom:2px solid var(--ink)}
.dlg-bar span{font-family:var(--mono);font-size:14px;font-weight:600}
.dlg-x{margin-left:auto;min-width:44px;height:34px;padding:0 12px;border:2px solid var(--ink);border-radius:8px;background:var(--paper);font-weight:700;font-size:14px}
.dlg-x:hover{background:var(--coral)}
.dlg-x:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.dlg-in{padding:24px clamp(16px,4vw,32px) 30px}
.dlg .eb{font-family:var(--mono);font-size:14px;color:var(--ink2);font-weight:500}
.dlg h2{font-size:clamp(28px,5vw,38px);line-height:1.2;font-weight:700;margin:2px 0 10px}
.dlg .chips{margin-bottom:14px}
.dlg .ds{font-size:17px;max-width:62ch}
.dlg .shots{display:grid;gap:22px;margin:22px 0}
.dlg figure img{width:100%;height:auto;border-radius:8px;border:2px solid var(--ink);box-shadow:5px 5px 0 var(--bc)}
.dlg figcaption{font-size:15px;color:var(--ink2);margin-top:10px;font-weight:600}

/* ===== mosaic-terminal skin over fffOS (matches bunker/31-mosaic-terminal) ===== */
:root{
  --ink:#f2f0ea;--ink2:#9c9a92;--dim:#9c9a92;--line:rgba(242,240,234,.2);--acc:#b9ff7a;--pk:#ff4fa3;--bl:#6c8cff;--am:#ffb347;--nc:#22e6ff;
  --paper:#080808;--paper2:#0e0e0e;--navy:#000;--amber:var(--am);--coral:var(--pk);--teal:var(--acc);
  --logo:'Instrument Serif','Noto Serif Thai',Georgia,serif;--serif:'Bodoni Moda','Noto Serif Thai',serif;--pix:'DotGothic16','Noto Sans Thai',monospace;
  --mono:'JetBrains Mono','Noto Sans Thai',ui-monospace,monospace;--ui:var(--mono);--mb:40px;
}
html,body{background:#000;color:var(--ink);font-family:var(--mono);font-size:15px;line-height:1.75}
body::after{content:"";position:fixed;inset:0;z-index:70;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 62%,rgba(0,0,0,.5))}
::selection{background:var(--acc);color:#000}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.wall{background:#000}
.wall::before{display:none;background-image:linear-gradient(rgba(242,240,234,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(242,240,234,.04) 1px,transparent 1px);background-size:24px 24px;mask-image:radial-gradient(ellipse at 50% 45%,#000 10%,transparent 78%);-webkit-mask-image:radial-gradient(ellipse at 50% 45%,#000 10%,transparent 78%)}
.wall #mo{position:absolute;inset:0;width:100%;height:100%}
.wall .sun{display:none}
.doodle{position:absolute;right:150px;top:58px;font:500 15px var(--mono);color:var(--acc);display:flex;align-items:center;gap:8px;white-space:nowrap}
.doodle .pr{color:var(--pk)}
.doodle .caret{width:9px;height:17px;background:var(--acc);display:inline-block}
@media(prefers-reduced-motion:no-preference){.doodle .caret{animation:bl 1.06s steps(1) infinite}@keyframes bl{50%{opacity:0}}}
/* menubar */
.mb{background:linear-gradient(#000 70%,#000d);backdrop-filter:none;border-bottom:1px dashed rgba(242,240,234,.28);color:var(--ink);font-family:var(--mono);font-size:14px;font-weight:500}
.logo{background:none;border-radius:0;color:var(--acc);padding:0;font-family:var(--logo);font-style:italic;font-weight:400;font-size:26px;line-height:1;letter-spacing:0;text-transform:none}
.logo::before{content:"";}
.mb .app{font:500 13px var(--mono);color:var(--dim)}
.mb .app::before{content:"~/";color:var(--pk)}
.mb button{border-radius:0;font-weight:500}
.mb button:hover{background:var(--acc);color:#000}
.mb button:focus-visible{outline:2px solid var(--acc)}
.lang .a,.lang .b{opacity:.5}
.lang[aria-pressed="true"] .a,.lang[aria-pressed="false"] .b{opacity:1;color:var(--acc);text-decoration:none;border-bottom:1px solid var(--acc)}
.clock{color:var(--dim)}
/* icons = neon terminal tiles */
.c-about{--c:var(--acc)}.c-proj{--c:var(--bl)}.c-exp{--c:var(--pk)}.c-skills{--c:var(--am)}.c-contact{--c:var(--nc)}
.ico{width:56px;height:56px;border:1px solid var(--c);border-radius:0;background:#050505;color:var(--c);box-shadow:0 0 14px color-mix(in srgb,var(--c) 30%,transparent),inset 0 0 0 3px #000,inset 0 0 0 4px color-mix(in srgb,var(--c) 28%,transparent);transition:transform .25s steps(4),box-shadow .25s}
.c-about,.c-proj,.c-exp,.c-skills,.c-contact{background:#050505;color:var(--c)}
.ico svg{width:28px;height:28px}
.home .app{color:var(--ink);text-shadow:none;font-weight:500;font-size:14px}
.home .app>span:last-child{background:#000a;padding:0 8px;border-bottom:1px dotted var(--line);white-space:nowrap}
.home .app:hover{background:transparent}
.home .app:hover .ico,.home .app:focus-visible .ico{transform:translate(-2px,-2px);box-shadow:4px 4px 0 color-mix(in srgb,var(--c) 70%,transparent),0 0 22px color-mix(in srgb,var(--c) 45%,transparent)}
.home .app:focus-visible{outline:2px solid var(--acc)}
/* dock */

 n=tmp.length;bx=new Float32Array(n);by=new Float32Array(n);ox=new Float32Array(n);oy=new Float32Array(n);vx=new Float32Array(n);vy=new Float32Array(n);sz=new Float32Array(n);ph=new Float32Array(n);dl=new Float32Array(n);fm=new Int16Array(n);lv=new Int8Array(n);
